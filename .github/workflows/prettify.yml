name: prettify
on:
  pull_request:
    branches: [main]
concurrency:
  group: prettify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  prettier:
    name: Prettier check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: '0'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check formatting
        run: |-
          if ! npm run format:check; then
            echo "::error::Formatting issues found. Run 'npm run format' locally and commit the result."
            exit 1
          fi
